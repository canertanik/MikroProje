

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: mikroproje-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SA_PASSWORD}"
    
    volumes:
      - mikroproje-sql-data:/var/opt/mssql
    ports:
      - "1433:1433"
    healthcheck:
      test:
        - CMD
        - /opt/mssql-tools18/bin/sqlcmd
        - -S
        - localhost
        - -U
        - sa
        - -P
        - "${SA_PASSWORD}"
        - -Q
        - SELECT 1
        - -No
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    container_name: mikroproje-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  mikroproje-sql-data:
  redis-data:

