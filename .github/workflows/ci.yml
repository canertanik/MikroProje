name: MikroProje CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dotnet-ci:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore dependencies
        run: dotnet restore MikroProje.sln

      - name: Build solution
        run: dotnet build MikroProje.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test MikroProje.sln --configuration Release --no-build --verbosity normal

  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: dotnet-ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: mikroproje-api:ci
